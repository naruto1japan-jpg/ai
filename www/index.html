<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f2ef;--card:#fff;--tx:#1b1b1f;--mut:#6b6b73;--ac:#4f6bff;--bd:#e3e1dc;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e14;--card:#171923;--tx:#eef0f6;--mut:#9aa0b4;--ac:#7f95ff;--bd:#272b3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e14;--card:#171923;--tx:#eef0f6;--mut:#9aa0b4;--ac:#7f95ff;--bd:#272b3a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px;text-align:center}
h1{font-size:20px;margin:4px 0 0;letter-spacing:.04em}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.face{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1074/616;background:#0a1020;transition:box-shadow .4s}
.face img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .5s,transform .5s}
.pt{position:absolute;top:-6%;background:#ffc6dc;border-radius:80% 0;opacity:.8;pointer-events:none;animation:fall linear infinite}
@keyframes fall{from{top:-6%;transform:rotate(0)}to{top:106%;transform:rotate(300deg) translateX(30px)}}
.wave{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:4px;align-items:flex-end;height:22px;opacity:0;transition:opacity .3s}
.wave i{width:4px;height:4px;background:#cfe9ff;border-radius:2px;animation:w .5s ease-in-out infinite alternate}
@keyframes w{to{height:20px}}
.face.talk .wave{opacity:1}
.face.talk{animation:tg .6s infinite alternate}
@keyframes tg{from{box-shadow:0 0 10px #6af}to{box-shadow:0 0 34px #8cf}}
.face[data-e=calm] img{animation:br 5s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.035)}}
.face[data-e=listening]{box-shadow:0 0 0 2px #7cf,0 0 38px #4af}
.face[data-e=listening] img{filter:brightness(1.15) saturate(1.2);animation:br 2s ease-in-out infinite}
.face[data-e=thinking] img{animation:th 2.2s ease-in-out infinite}
@keyframes th{50%{filter:hue-rotate(40deg) brightness(1.1);transform:scale(1.02)}}
.face[data-e=happy] img{filter:saturate(1.35) brightness(1.12) hue-rotate(55deg);animation:bn 1.2s ease-in-out infinite}
@keyframes bn{50%{transform:scale(1.04) translateY(-2px)}}
.face[data-e=sad] img{filter:saturate(.45) brightness(.78);transform:translateY(5px) scale(1.02)}
.face[data-e=sad] .pt{opacity:.2}
.face[data-e=surprised] img{filter:brightness(1.28);animation:pp .5s forwards}
@keyframes pp{60%{transform:scale(1.1)}to{transform:scale(1.07)}}
.face[data-e=angry] img{filter:hue-rotate(150deg) saturate(1.8) contrast(1.15);animation:sk .15s infinite}
@keyframes sk{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
#emo{margin:8px 0 2px;font-size:14px;color:var(--mut)}
#status{min-height:22px;color:var(--mut);font-size:13px;margin:2px 0 8px}
.row{display:flex;gap:8px;margin:8px 0;align-items:center}
input,select,button.s{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
input{flex:1;min-width:0}
button.s{cursor:pointer}
#mic{width:64px;height:64px;flex:none;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:28px;cursor:pointer}
#mic.on{animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.1)}}
#wk{flex:1}
#wk.on{border-color:var(--ac);color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;text-align:left}
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
#heard,#reply{min-height:22px;word-wrap:break-word}
a.act{display:block;background:var(--ac);color:#fff;text-decoration:none;border-radius:10px;padding:12px;margin:8px 0 0;font-weight:600;text-align:center}
details{text-align:left;margin-top:14px}
summary{cursor:pointer;color:var(--mut);font-size:14px}
.app{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.app code{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.emos button{font-size:20px;padding:6px 10px}
button.act{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px;margin:8px 0 0;font:inherit;font-weight:600;cursor:pointer}</style></head>
<body><main>

for(let i=0;i<12;i++){const p=document.createElement("span");p.className="pt";const s=6+Math.random()*8;p.style.cssText="left:"+Math.random()*100+"%;width:"+s+"px;height:"+s+"px;animation-duration:"+(6+Math.random()*7)+"s;animation-delay:-"+Math.random()*10+"s";$("face").appendChild(p)}
let custom=[];try{custom=JSON.parse(localStorage.getItem("apps")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("apps",JSON.stringify(custom))}catch(e){}};
const BUILT={
 spotify:["Spotify",q=>"https://open.spotify.com/search/"+enc(q)],
 youtube:["YouTube",q=>"https://www.youtube.com/results?search_query="+enc(q)],
 maps:["Maps",q=>"https://www.google.com/maps/search/?api=1&query="+enc(q)],
 google:["Google",q=>"https://www.google.com/search?q="+enc(q)],
 amazon:["Amazon",q=>"https://www.amazon.in/s?k="+enc(q)]
};
const status=t=>$("status").textContent=t;
const idleStatus=()=>status(wakeOn?"Say “Hey Misa”":"Ready");
const toOpen=[];
function openUrl(u){try{if(AL)AL.openUrl({url:u});else window.open(u,"_blank")}catch(e){window.open(u,"_blank")}}
function addAct(label,url){const b=document.createElement("button");b.className="act";b.textContent=label;b.onclick=()=>openUrl(url);$("acts").appendChild(b);if(native)toOpen.push(url)}
function renderList(){const l=$("list");l.textContent="";custom.forEach((a,i)=>{const d=document.createElement("div");d.className="app";const n=document.createElement("span");n.textContent=a.name;const c=document.createElement("code");c.textContent=a.url;const b=document.createElement("button");b.className="s";b.textContent="✕";b.onclick=()=>{custom.splice(i,1);save();renderList()};d.append(n,c,b);l.appendChild(d)});if(!custom.length)l.textContent="No custom apps yet."}
renderList();
$("add").onclick=()=>{const n=$("an").value.trim(),u=$("au").value.trim();if(!n||!u.includes("{q}")){status("Add a name and a link containing {q}");return}custom.push({name:n,url:u});save();renderList();$("an").value=$("au").value=""};
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
let pendingEmo=null;
const tools=[
 {name:"set_emotion",description:"Set Misa’s facial emotion to match her reply. Call once per reply.",inputSchema:{type:"object",properties:{emotion:{type:"string",enum:["calm","happy","sad","surprised","angry"]}},required:["emotion"]},
  execute:({emotion})=>{pendingEmo=emotion;return "ok"}},
 {name:"open_app",description:"Search or open something in an app (Spotify, YouTube, Maps, Google, Amazon, or a custom app).",inputSchema:{type:"object",properties:{app:{type:"string"},query:{type:"string"}},required:["app","query"]},
  execute:({app,query})=>{const k=app.toLowerCase();if(BUILT[k]){addAct("Open "+BUILT[k][0]+": "+query,BUILT[k][1](query));return "button shown"}const c=custom.find(a=>a.name.toLowerCase()===k);if(c){addAct("Open "+c.name+": "+query,c.url.replace("{q}",enc(query)));return "button shown"}throw new Error("unknown app")}},
 {name:"compose_email",description:"Draft an email in Gmail.",inputSchema:{type:"object",properties:{to:{type:"string"},subject:{type:"string"},body:{type:"string"}},required:["subject","body"]},
  execute:({to="",subject,body})=>{addAct("Open Gmail draft: "+subject,"https://mail.google.com/mail/?view=cm&to="+enc(to)+"&su="+enc(subject)+"&body="+enc(body));return "button shown"}},
 {name:"add_event",description:"Add an event to Google Calendar. start is local time like 2026-10-18T16:15.",inputSchema:{type:"object",properties:{title:{type:"string"},start:{type:"string"},minutes:{type:"number"}},required:["title","start"]},
  execute:({title,start,minutes=60})=>{const s=new Date(start);if(isNaN(s))throw new Error("bad date");const e=new Date(s.getTime()+minutes*60000);addAct("Add to Calendar: "+title,"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+enc(title)+"&dates="+fmt(s)+"/"+fmt(e));return "button shown"}},
 {name:"whatsapp",description:"Prepare a WhatsApp message.",inputSchema:{type:"object",properties:{text:{type:"string"}},required:["text"]},
  execute:({text})=>{addAct("Open WhatsApp","https://wa.me/?text="+enc(text));return "button shown"}},
 {name:"call",description:"Dial a phone number.",inputSchema:{type:"object",properties:{number:{type:"string"}},required:["number"]},
  execute:({number})=>{addAct("Call "+number,"tel:"+number.replace(/[^\d+]/g,""));return "button shown"}}
];
const CAP=window.Capacitor,native=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const NSR=native?CAP.registerPlugin("SpeechRecognition"):null;
const AL=native?CAP.registerPlugin("AppLauncher"):null;
const WSR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MODEL="claude-haiku-5-5";
let listening=false,wakeOn=false,awake=false,awakeT=0,busy=false,speaking=false,last="",hist=[],wrec=null,ac;
const getKey=()=>{try{return localStorage.getItem("akey")||""}catch(e){return ""}};
$("ksave").onclick=()=>{try{localStorage.setItem("akey",$("key").value.trim())}catch(e){}$("key").value="";status("Key saved")};
const WAKE=/(hey|hay|hi|hello|ok|okay|हे|हैलो|हेलो)[\s,]*(misa|missa|meesa|mesa|misha|mysa|मीसा|मिसा|मिशा|मीशा)/i;
function beep(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch(e){}}
function paintWk(){$("wk").classList.toggle("on",wakeOn);$("wk").textContent="👂 Always listening: "+(wakeOn?"On":"Off")}
function micBlocked(){wakeOn=false;awake=false;listening=false;paintWk();setEmotion("calm");status("Mic permission needed. Allow it in Android settings.")}
function scheduleRestart(ms){setTimeout(()=>{if((wakeOn||awake)&&!speaking&&!busy&&!listening)startRec()},ms)}
function startWeb(){
 const me=wrec=new WSR();me.lang=$("lang").value;me.interimResults=true;
 me.onresult=e=>{const r=e.results[e.results.length-1];handleText(r[0].transcript.trim(),r.isFinal)};
 me.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")micBlocked()};
 me.onend=()=>{if(wrec!==me)return;listening=false;scheduleRestart(300)};
 try{me.start();listening=true}catch(e){listening=false}
}
async function startRec(){
 if(listening||speaking)return;
 if(native){
  try{const p=await NSR.requestPermissions();if(p.speechRecognition&&p.speechRecognition!=="granted"){micBlocked();return}}catch(e){}
  listening=true;last="";
  try{await NSR.start({language:$("lang").value,partialResults:true,popup:false,maxResults:1})}catch(e){listening=false;scheduleRestart(1500)}
 }else if(WSR){startWeb()}else status("Voice input isn’t supported here. Type instead.");
}
function stopRec(){
 listening=false;
 if(native){try{NSR.stop().catch(()=>{})}catch(e){}}
 else{const w=wrec;wrec=null;try{w&&w.abort()}catch(e){}}
}
if(native){
 NSR.addListener("partialResults",d=>{const t=((d&&d.matches&&d.matches[0])||"").trim();if(t){last=t;handleText(t,false)}});
 NSR.addListener("listeningState",d=>{if(d&&d.status==="stopped"){listening=false;const t=last;last="";if(t)handleText(t,true);scheduleRestart(400)}});
}
function wake(){awake=true;beep();setEmotion("listening");status("Listening…");clearTimeout(awakeT);awakeT=setTimeout(endAwake,9000)}
function endAwake(){awake=false;clearTimeout(awakeT);if(!wakeOn)stopRec();if(!busy&&!speaking)setEmotion("calm");idleStatus()}
function handleText(t,fin){
 if(speaking||busy||!t)return;
 const m=t.match(WAKE);
 if(awake){
  const text=m?t.slice(m.index+m[0].length).trim():t;
  $("heard").textContent=text||t;
  if(fin&&text){endAwake();ask(text)}
  return;
 }
 if(!m)return;
 const rest=t.slice(m.index+m[0].length).trim();
 if(!rest){wake();return}
 $("heard").textContent=rest;
 if(fin)ask(rest);
}
function speak(t){
 speaking=true;stopRec();$("face").classList.add("talk");
 const done=()=>{if(!speaking)return;speaking=false;$("face").classList.remove("talk");const go=toOpen.shift();toOpen.length=0;if(go)openUrl(go);if(wakeOn)startRec();idleStatus();setTimeout(()=>{if(!busy&&!awake&&!speaking)setEmotion("calm")},2500)};
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=$("lang").value;u.onend=done;u.onerror=done;speechSynthesis.speak(u);setTimeout(done,Math.max(4000,t.length*120))}catch(e){done()}
}
function sys(){
 const apps=[...Object.keys(BUILT),...custom.map(a=>a.name)].join(", ");
 return "You are Misa, a calm, warm, slightly playful female voice assistant on the user’s phone. Answer in one or two short spoken sentences, in the same language as the user. Always call set_emotion once to match your mood. To act, call a tool; the app opens it for the user. Current time: "+new Date().toString()+". Apps for open_app: "+apps+". You cannot read the user’s emails or calendar; say so briefly if asked."
}
async function callClaude(text){
 const msgs=[...hist,{role:"user",content:text}];
 const tl=tools.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema}));
 for(let i=0;i<4;i++){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":getKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:400,system:sys(),tools:tl,messages:msgs})});
  if(!res.ok)throw {code:res.status===401?"bad_key":"http"};
  const d=await res.json();
  msgs.push({role:"assistant",content:d.content});
  const uses=d.content.filter(b=>b.type==="tool_use");
  if(d.stop_reason!=="tool_use"||!uses.length)return d.content.filter(b=>b.type==="text").map(b=>b.text).join(" ").trim();
  const results=[];
  for(const u of uses){let out="ok",err=false;try{out=String(await tools.find(t=>t.name===u.name).execute(u.input))}catch(e){out=String(e&&e.message||e);err=true}results.push({type:"tool_result",tool_use_id:u.id,content:out,is_error:err})}
  msgs.push({role:"user",content:results});
 }
 return "";
}
function fail(msg){busy=false;setEmotion("sad");$("reply").textContent=msg;idleStatus();scheduleRestart(300);setTimeout(()=>{if(!busy&&!awake&&!speaking)setEmotion("calm")},2500)}
async function ask(text){
 text=text.trim();if(!text||busy)return;
 busy=true;pendingEmo=null;toOpen.length=0;$("heard").textContent=text;$("acts").textContent="";$("reply").textContent="…";setEmotion("thinking");status("Thinking…");
 if(!getKey()){fail("Add your Anthropic API key in Settings first.");return}
 try{
  const txt=(await callClaude(text))||"Done.";
  busy=false;hist.push({role:"user",content:text},{role:"assistant",content:txt});hist=hist.slice(-8);
  $("reply").textContent=txt;setEmotion(pendingEmo||"calm");speak(txt);
 }catch(e){fail(e&&e.code==="bad_key"?"That API key was rejected.":"Something went wrong. Try again.")}
}
$("wk").onclick=()=>{
 if(!native&&!WSR){status("Voice input isn’t supported here. Type instead.");return}
 wakeOn=!wakeOn;paintWk();
 if(wakeOn){beep();startRec();idleStatus()}else{if(!awake)stopRec();idleStatus()}
};
$("mic").onclick=()=>{
 if(!native&&!WSR){status("Voice input isn’t supported here. Type instead.");return}
 if(awake){endAwake();return}
 startRec();wake();
};
$("lang").onchange=()=>{if(wakeOn||awake){stopRec();scheduleRestart(600)}};
$("go").onclick=()=>{ask($("txt").value);$("txt").value=""};
$("txt").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
</script></body></html>
